<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="asgardeoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7300"/>
      <stop offset="100%" stop-color="#5C45FD"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA043"/>
      <stop offset="60%" stop-color="#FF7300"/>
      <stop offset="100%" stop-color="#D95E00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="#0A0E18"/>
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#asgardeoGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Shield Shape -->
  <path d="M16 6 L23 9 C23 15 19.5 21 16 24 C12.5 21 9 15 9 9 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Keyhole / Security Core -->
  <circle cx="16" cy="13" r="2.2" fill="#0A0E18"/>
  <path d="M15 13.5 L17 13.5 L17.5 17.5 L14.5 17.5 Z" fill="#0A0E18"/>
  <circle cx="16" cy="13" r="1.1" fill="#FFA043"/>
</svg>
